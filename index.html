<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#01A1E0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>4글자 게임 · 진행자 화면</title>

<style>
/* ============================================================
   1. 디자인 토큰 (브랜드 컬러 / 간격 / 반경)
   ============================================================ */
:root {
  --brand:        #01A1E0;   /* 대유 브랜드 메인 컬러 */
  --brand-dark:   #0186BC;
  --brand-soft:   #E4F5FD;
  --ng:           #FF4D4F;   /* 땡 버튼 */
  --ng-dark:      #E03B3D;
  --ink:          #101828;
  --muted:        #6B7280;
  --line:         #E5E7EB;
  --card:         #FFFFFF;
  --bg:           #F2F8FB;
  --radius:       18px;
  --radius-lg:    24px;
  --shadow:       0 2px 10px rgba(16, 24, 40, .06);
}

/* ============================================================
   2. 리셋 & 기본 (모바일 터치 최적화)
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Pretendard', 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
               system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

body {
  /* 진행자가 실수로 화면을 드래그/확대하지 않도록 */
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  color: inherit;
  border: none;
  background: none;
  cursor: pointer;
  touch-action: manipulation;   /* 더블탭 확대 방지 */
}

button:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}

/* ============================================================
   3. 레이아웃 골격
   ============================================================ */
.app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
  gap: 10px;
}

.screen { display: none; flex-direction: column; flex: 1; gap: 10px; min-height: 0; }
.screen.active { display: flex; }

/* 결과 화면에서는 앱 높이를 화면에 딱 맞춰, 긴 목록이 페이지 전체를
   늘리지 않고 목록 카드 안에서만 스크롤되도록 한다. */
.app.locked { height: 100dvh; overflow: hidden; }

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}

/* ============================================================
   4. 홈 화면
   ============================================================ */
.home-head {
  text-align: center;
  padding: 26px 16px 22px;
}
.home-head .logo {
  display: inline-block;
  background: var(--brand);
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .08em;
  padding: 5px 12px;
  border-radius: 999px;
  margin-bottom: 12px;
}
.home-head h1 {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -.02em;
}
.home-head p {
  margin-top: 6px;
  font-size: 14px;
  color: var(--muted);
}

/* 팀 선택 버튼 2x2 그리드 */
.team-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.team-btn {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px 14px;
  text-align: center;
  transition: transform .08s ease, border-color .15s, background .15s;
  box-shadow: var(--shadow);
}
.team-btn:active { transform: scale(.97); }
.team-btn .name {
  font-size: 30px;
  font-weight: 900;
  color: var(--brand);
  letter-spacing: -.01em;
}
.team-btn .meta {
  margin-top: 6px;
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}
.team-btn .bar {
  margin-top: 10px;
  height: 6px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.team-btn .bar > i {
  display: block;
  height: 100%;
  background: var(--brand);
  border-radius: 999px;
  transition: width .3s ease;
}
.team-btn.done { border-color: var(--brand); background: var(--brand-soft); }

/* ============================================================
   5. 게임 화면 - 상단 헤더
   ============================================================ */
.g-head {
  padding: 14px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.g-head .row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.team-badge {
  background: var(--brand);
  color: #fff;
  font-size: 20px;
  font-weight: 900;
  padding: 6px 16px;
  border-radius: 999px;
  letter-spacing: -.01em;
}
.q-count {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.q-count small { font-size: 16px; color: var(--muted); font-weight: 700; }

.progress {
  height: 8px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.progress > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--brand);
  border-radius: 999px;
  transition: width .25s ease;
}

/* 진행 상태 3분할 지표 */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  text-align: center;
}
.stats div { padding: 2px 0; }
.stats div + div { border-left: 1px solid var(--line); }
.stats .k { font-size: 11px; color: var(--muted); font-weight: 700; }
.stats .v {
  font-size: 17px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}
.stats .v.brand { color: var(--brand); }

/* ============================================================
   6. 타이머
   ============================================================ */
.timer-card { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.timer-top { display: flex; align-items: center; gap: 12px; }

.time-num {
  font-size: 44px;
  font-weight: 900;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.03em;
  min-width: 92px;
}
.time-num.warn { color: var(--ng); animation: blink .9s steps(1, end) infinite; }
@keyframes blink { 50% { opacity: .35; } }

.timer-ctrl { display: flex; gap: 8px; flex: 1; }
.tbtn {
  flex: 1;
  min-height: 46px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: #fff;
  font-size: 15px;
  font-weight: 800;
  transition: transform .08s ease;
}
.tbtn:active { transform: scale(.96); }
.tbtn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }

/* 시간 변경 칩 */
.chips { display: flex; gap: 8px; }
.chip {
  flex: 1;
  min-height: 38px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: #fff;
  font-size: 14px;
  font-weight: 800;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-dark); }

/* ============================================================
   7. 단어 카드 (화면의 주인공)
   ============================================================ */
.word-card {
  flex: 1;
  min-height: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px 14px;
  text-align: center;
}
.word {
  font-size: clamp(52px, 20vw, 100px);
  font-weight: 900;
  letter-spacing: .02em;
  line-height: 1.15;
  word-break: keep-all;
}
.word-card .hint { font-size: 13px; color: var(--muted); font-weight: 600; }
.word-card .hint:empty { display: none; }   /* 문구가 없으면 자리도 차지하지 않게 */

/* 종료 상태 */
.word-card.finished .word { font-size: clamp(20px, 5.8vw, 28px); color: var(--brand); }
.finish-actions { display: none; gap: 8px; margin-top: 4px; }
.word-card.finished .finish-actions { display: flex; }
.finish-actions button {
  border: 2px solid var(--brand);
  color: var(--brand-dark);
  background: #fff;
  border-radius: 12px;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 800;
}

/* ============================================================
   8. 조작 버튼 (한 손 조작 · 큰 터치 영역)
   ============================================================ */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); --gap: 10px; }
.abtn {
  min-height: 72px;
  border-radius: var(--radius-lg);
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -.01em;
  transition: transform .08s ease, filter .15s;
  box-shadow: var(--shadow);
}
.abtn:active { transform: scale(.96); filter: brightness(.94); }
.abtn.ok  { background: var(--brand); color: #fff; }
.abtn.ng  { background: var(--ng); color: #fff; }
/* 게임 화면에서 가장 자주 누르는 두 버튼만 높이를 키운다.
   결과 화면의 '홈으로' 등 다른 ok 버튼은 기본 크기를 유지한다. */
#screenGame .abtn.ok, #screenGame .abtn.ng { min-height: 128px; font-size: 26px; }
.abtn.sub {
  min-height: 58px;
  font-size: 17px;
  background: #fff;
  border: 2px solid var(--line);
  color: var(--ink);
}
.abtn.sub.home { color: var(--muted); }
.abtn[disabled] { opacity: .35; pointer-events: none; }

/* 하단 3분할 버튼(다음 문제 / 끝 / 홈) */
/* 첫 칸은 위의 '정답'과 같은 너비, 나머지 두 칸이 합쳐서 '땡' 너비를 채운다 */
.actions.three { grid-template-columns: calc(50% - var(--gap) / 2) 1fr 1fr; }
.actions.three .abtn.sub { font-size: 16px; }
.abtn.sub.end { color: var(--ng); border-color: #FFD9D9; }

/* ============================================================
   9-1. 결과 화면 — 땡 단어 모아 보기
   ============================================================ */
.r-head { padding: 10px 14px; display: flex; flex-direction: column; }
.r-head .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* 팀과 점수 사이에 들어가는 작은 지표 (푼 문제 / 넘김) */
.r-mini { display: flex; gap: 14px; align-items: center; }
.r-mini > span { display: flex; align-items: baseline; gap: 4px; }
.r-mini .k { font-size: 11px; font-weight: 700; color: var(--muted); font-style: normal; }
.r-mini b { font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }

.review-card {
  flex: 1;
  padding: 12px;
  display: flex;
  flex-direction: column;
  min-height: 0;                 /* 스크롤이 카드 안에서만 생기도록 */
}

/* 좌우 2단: 왼쪽 맞힌 단어 / 오른쪽 틀린 단어 */
.review-cols {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  min-height: 0;
}
.review-col {
  display: flex;
  flex-direction: column;
  min-height: 0;                 /* 각 열이 따로 스크롤되도록 */
}
.review-col + .review-col { border-left: 1px solid var(--line); padding-left: 10px; }

.review-title {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .02em;
  margin: 0 0 8px 2px;
  color: var(--muted);
}
.review-title span {
  display: inline-block;
  min-width: 20px;
  padding: 1px 6px;
  margin-left: 3px;
  border-radius: 999px;
  font-size: 11px;
  text-align: center;
  color: #fff;
}
.review-title.ok { color: var(--brand-dark); }
.review-title.ok span { background: var(--brand); }
.review-title.ng { color: var(--ng-dark); }
.review-title.ng span { background: var(--ng); }

.review-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-right: 2px;
}
.review-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border: 2px solid var(--line);
  border-radius: 12px;
}
.review-item.ok { border-color: var(--brand-soft); background: var(--brand-soft); }
.review-item.ng { border-color: #FFE1E1; background: #FFF3F3; }
.review-item .n {
  font-size: 11px;
  font-weight: 800;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  min-width: 15px;
}
.review-item .w {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: -.01em;
  word-break: keep-all;
}
.review-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  line-height: 1.5;
  white-space: pre-line;   /* 안내 문구의 줄바꿈을 그대로 살린다 */
}

/* ============================================================
   9. 점수판 (항상 표시)
   ============================================================ */
.score-board { padding: 10px; }
.score-board .title {
  font-size: 11px;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: .06em;
  margin: 2px 0 8px 4px;
}
.score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.score-item {
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 8px 4px;
  text-align: center;
}
.score-item .t { font-size: 12px; font-weight: 800; color: var(--muted); }
.score-item .s {
  font-size: 22px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.stats .v.bump { animation: bump .35s ease; display: inline-block; }
@keyframes bump {
  0% { transform: scale(1); }
  40% { transform: scale(1.14); }
  100% { transform: scale(1); }
}

/* ============================================================
   10. 하단 유틸 버튼
   ============================================================ */
.utils { display: flex; gap: 8px; }
.ubtn {
  flex: 1;
  min-height: 46px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: #fff;
  font-size: 13px;
  font-weight: 800;
  color: var(--muted);
  padding: 0 4px;
  white-space: nowrap;
}
.ubtn.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-dark); }
.ubtn:active { transform: scale(.97); }
.ubtn.danger { color: var(--ng); border-color: #FFD9D9; }

/* ============================================================
   10-1. 확인 창 (브라우저 confirm 대신 직접 그린다)
   ------------------------------------------------------------
   인앱 브라우저(카카오톡/네이버 등)나 '대화상자 차단'이 켜진 크롬에서는
   confirm()이 무시되어 버튼이 먹통이 된다. 그래서 화면 안에서 처리한다.
   ============================================================ */
.modal-back {
  position: fixed;
  inset: 0;
  background: rgba(16, 24, 40, .5);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 100;
}
.modal-back.show { display: flex; }
.modal {
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 24px 20px 18px;
  width: 100%;
  max-width: 340px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(16, 24, 40, .22);
}
.modal h2 { font-size: 19px; font-weight: 900; }
.modal p { margin-top: 8px; font-size: 14px; color: var(--muted); line-height: 1.5; }
.modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.modal-actions button {
  min-height: 52px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 800;
}
.modal-actions .cancel { border: 2px solid var(--line); background: #fff; color: var(--muted); }
.modal-actions .confirm { background: var(--ng); color: #fff; }
.modal-actions button:active { transform: scale(.97); }

/* ============================================================
   11. 토스트
   ============================================================ */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  background: rgba(16, 24, 40, .92);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  padding: 11px 20px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 50;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 접근성: 모션 최소화 설정 존중 */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* 작은 화면에서도 스크롤 없이 한 화면에 들어오도록 압축 */
@media (max-height: 720px) {
  .app { gap: 7px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
  .screen { gap: 7px; }
  .abtn { min-height: 62px; font-size: 20px; }
  #screenGame .abtn.ok, #screenGame .abtn.ng { min-height: 110px; font-size: 22px; }
  .abtn.sub { min-height: 50px; font-size: 16px; }
  .time-num { font-size: 38px; min-width: 78px; }
  .tbtn { min-height: 42px; }
  .chip { min-height: 34px; }
  .timer-card { padding: 10px 12px; gap: 8px; }
  .g-head { padding: 10px 14px 9px; gap: 8px; }
  .word-card { min-height: 100px; padding: 8px 12px; }
  .finish-actions button { padding: 8px 14px; font-size: 13px; }
  .score-board { padding: 7px; }
  .score-item { padding: 5px 4px; }
  .score-item .s { font-size: 19px; }
}
</style>
</head>

<body>
<div class="app">

  <!-- ==========================================================
       홈 화면
       ========================================================== -->
  <section id="screenHome" class="screen active">

    <div class="card home-head">
      <span class="logo">DaeuAIon</span>
      <h1>4글자 게임</h1>
      <p>팀을 선택하면 바로 시작합니다</p>
    </div>

    <div class="team-grid" id="teamGrid"><!-- JS로 렌더링 --></div>

    <div style="flex:1"></div>

    <div class="card score-board">
      <div class="title">점수판</div>
      <div class="score-grid" id="scoreHome"></div>
    </div>

    <div class="utils">
      <button class="ubtn" id="btnShuffle">🔀 무작위</button>
      <button class="ubtn" id="btnSoundHome">🔊 소리 켜짐</button>
      <button class="ubtn danger" id="btnNewGame">새 게임 시작</button>
    </div>
  </section>

  <!-- ==========================================================
       게임 화면
       ========================================================== -->
  <section id="screenGame" class="screen">

    <!-- 상단: 팀 / 문제번호 / 진행률 -->
    <div class="card g-head">
      <div class="row">
        <span class="team-badge" id="gTeam">A팀</span>
        <span class="q-count"><span id="gNo">1</span> <small>/ <span id="gTotal">66</span></small></span>
      </div>
      <div class="progress"><i id="gBar"></i></div>
      <div class="stats">
        <div><div class="k">진행률</div><div class="v" id="gPct">0%</div></div>
        <div><div class="k">남은 문제</div><div class="v" id="gLeft">66</div></div>
        <div><div class="k">팀 점수</div><div class="v brand" id="gScore">0</div></div>
      </div>
    </div>

    <!-- 단어 -->
    <div class="card word-card" id="wordCard">
      <div class="word" id="wordText">준비</div>
      <div class="hint" id="wordHint"></div>
      <div class="finish-actions">
        <button id="btnReplayTeam">이 팀 다시하기</button>
      </div>
    </div>

    <!-- 타이머 -->
    <div class="card timer-card">
      <div class="timer-top">
        <div class="time-num" id="tNum">60</div>
        <div class="timer-ctrl">
          <button class="tbtn primary" id="btnTimerToggle">시작</button>
          <button class="tbtn" id="btnTimerReset">초기화</button>
        </div>
      </div>
      <div class="chips" id="timeChips">
        <button class="chip" data-sec="30">30초</button>

/* ============================================================
   [사운드] Web Audio API로 효과음 직접 생성 (외부 파일 없음)
   ============================================================ */
let audioCtx = null;

/** 오디오 컨텍스트를 준비한다. (모바일은 사용자 터치 후에만 소리 가능) */
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/**
 * 출력 버스. 글리산도처럼 여러 음이 겹치면 진폭이 합산되어 찢어지는(클리핑)
 * 소리가 나므로, 리미터를 한 단 걸어 최대 음량을 눌러 준다.
 */
function getBus(ctx) {
  if (!ctx.__bus) {
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-2, ctx.currentTime);
    comp.knee.setValueAtTime(4, ctx.currentTime);
    comp.ratio.setValueAtTime(8, ctx.currentTime);
    comp.attack.setValueAtTime(0.002, ctx.currentTime);
    comp.release.setValueAtTime(0.12, ctx.currentTime);

    const master = ctx.createGain();
    master.gain.setValueAtTime(1.0, ctx.currentTime);

    comp.connect(master).connect(ctx.destination);
    ctx.__bus = comp;
  }
  return ctx.__bus;
}

/**
 * 실로폰 느낌의 한 음을 친다.
 * 실로폰은 기음 위에 3배·6배 배음이 강하게 실리고 아주 빠르게 감쇠한다.
 */
function strikeBar(freq, startAt, duration = 0.5, volume = 0.5) {
  const ctx = audioCtx;
  const bus = getBus(ctx);
  const partials = [
    // 실제 실로폰은 높은 배음일수록 먼저 사라진다. decay로 그 차이를 준다.
    { ratio: 1,    gain: 1.00, type: 'sine',     decay: 1.00 },
    { ratio: 3.01, gain: 0.42, type: 'sine',     decay: 0.45 },
    { ratio: 6.05, gain: 0.14, type: 'triangle', decay: 0.22 }
  ];

  partials.forEach(p => {
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();

    osc.type = p.type;
    osc.frequency.setValueAtTime(freq * p.ratio, startAt);

    // 순간적으로 때린 뒤 지수적으로 사라지는 타건 엔벨로프
    const peak = volume * p.gain;
    amp.gain.setValueAtTime(0.0001, startAt);
    amp.gain.exponentialRampToValueAtTime(peak, startAt + 0.006);
    amp.gain.exponentialRampToValueAtTime(0.0001, startAt + duration * p.decay);

    osc.connect(amp).connect(bus);
    osc.start(startAt);
    osc.stop(startAt + duration + 0.05);
  });
}

/**
 * 땡! — 실로폰을 딱 한 번 때린 소리.
 * 음을 여러 개 늘어놓지 않고 한 음만 쳐서 길게 울리도록 한다.
 */
const WRONG_NOTE = 1046.50;   // C6

function playWrongSound() {
  if (!state.soundOn) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  strikeBar(WRONG_NOTE, ctx.currentTime, 1.40, 1.00);
}

/** 시간 종료 — 짧게 내려오는 3음 */
function playTimeUpSound() {
  if (!state.soundOn) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  const t = ctx.currentTime;
  strikeBar(783.99, t,        0.28, 0.36); // G5
  strikeBar(659.25, t + 0.14, 0.28, 0.36); // E5
  strikeBar(523.25, t + 0.28, 0.80, 0.40); // C5
}

function renderTimer() {
  const shown = Math.ceil(state.timerLeft);
  els.tNum.textContent = shown;
  els.tNum.classList.toggle('warn', shown <= 10);
  els.btnTimerToggle.textContent = timerInterval ? '일시정지' : '시작';
  els.btnTimerToggle.classList.toggle('primary', !timerInterval);

  // 선택된 시간 칩 표시
  els.timeChips.querySelectorAll('.chip').forEach(chip => {
    chip.classList.toggle('on', Number(chip.dataset.sec) === state.timerTotal);
  });
}

function startTimer() {
  if (timerInterval) return;
  if (state.timerLeft <= 0) return;

  ensureAudio(); // 터치 시점에 오디오 잠금 해제
  timerDeadline = Date.now() + state.timerLeft * 1000;

  timerInterval = setInterval(() => {
    const left = (timerDeadline - Date.now()) / 1000;
    state.timerLeft = Math.max(0, left);

    if (state.timerLeft <= 0) {
      state.timerLeft = 0;
      stopTimer();
      playTimeUpSound();          // 종료 효과음
      showToast('시간 종료');
      // 문제는 자동으로 넘어가지 않는다.
    }
    renderTimer();
  }, 100);

  renderTimer();
  saveState();
}

/** 타이머를 멈추고 남은 시간을 확정한다. */
function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
    state.timerLeft = Math.max(0, (timerDeadline - Date.now()) / 1000);
  }
  saveState();
}

function pauseTimer() {
  stopTimer();
  renderTimer();
}

function toggleTimer() {
  timerInterval ? pauseTimer() : startTimer();
}

function resetTimer() {
  stopTimer();
  state.timerLeft = state.timerTotal;
  renderTimer();
  saveState();
}

/** 제한 시간 변경 (30/60/90/120초) — 변경 시 타이머는 초기화 */
function setTimerTotal(sec) {
  state.timerTotal = sec;
  resetTimer();
  showToast(sec + '초로 변경');
}

/**
 * 배열을 무작위로 섞는다 (피셔-예이츠).
 * 뒤에서부터 임의의 앞 요소와 맞바꿔, 모든 순열이 같은 확률로 나온다.
 */
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * 해당 팀의 출제 순서를 새로 만든다.
 * 단어 자체가 아니라 '인덱스 배열'을 저장하므로, 나중에 엑셀 단어를 바꿔도
 * 개수만 같으면 순서 정보가 그대로 유효하다.
 */
function makeOrder(team) {
  const idx = WORDS[team].map((_, i) => i);
  state.order[team] = state.shuffle ? shuffled(idx) : idx;
}

/**
 * 저장된 순서가 쓸 수 있는 상태인지 확인하고, 아니면 새로 만든다.
 * (처음 시작 / 단어 개수가 바뀐 경우 / 저장값이 깨진 경우)
 */
function ensureOrder(team) {
  const o = state.order[team];
  if (!Array.isArray(o) || o.length !== WORDS[team].length) makeOrder(team);
}

/** 현재 팀의 단어를 '출제 순서대로' 돌려준다 */
function currentWords() {
  const team = state.currentTeam;
  if (!team || !WORDS[team]) return [];
  ensureOrder(team);
  return state.order[team].map(i => WORDS[team][i]);
}

function isFinished() {
  return state.progress[state.currentTeam] >= currentWords().length;
}

/** 팀 게임 시작(또는 이어하기) */
function startTeam(team) {
  state.currentTeam = team;
  // 아직 한 문제도 풀지 않았다면 순서를 새로 섞는다.
  // 진행 중이던 팀은 순서를 유지해야 이어하기가 어긋나지 않는다.
  if (state.progress[team] === 0) makeOrder(team);
  else ensureOrder(team);
  resetTimer();
  saveState();
  showScreen('game');
  renderGame();
}

/** 정답: 점수 +1 후 자동으로 다음 문제 */
function markCorrect() {
  if (isFinished()) return;
  const team = state.currentTeam;
  state.scores[team] += 1;    // 정답은 효과음 없이 조용히 처리한다

  // 나중에 모아 보기 위해 맞힌 단어를 순서대로 저장한다
  const word = currentWords()[state.progress[team]];
  const list = state.correct[team];
  if (word && !list.includes(word)) list.push(word);

  nextWord();                 // 화면을 먼저 갱신한 뒤
  bumpScore();                // 상단 팀 점수에 애니메이션을 준다
}

/** 땡: 점수 변화 없음, 단어를 기록하고 효과음 재생 후 다음 문제 */
function markWrong() {
  if (isFinished()) return;

  // 나중에 모아 보기 위해 틀린 단어를 순서대로 저장한다
  const word = currentWords()[state.progress[state.currentTeam]];
  const list = state.wrong[state.currentTeam];
  if (word && !list.includes(word)) list.push(word);

  playWrongSound();
  nextWord();
}

/** 점수 변화 없이 다음 단어로 */
function nextWord() {
  if (isFinished()) return;
  state.progress[state.currentTeam] += 1;
  saveState();
  renderGame();
}

/** 해당 팀의 문제 진행만 처음으로 되돌린다(점수는 유지) */
function replayTeam() {
  state.progress[state.currentTeam] = 0;
  state.correct[state.currentTeam] = [];  // 맞힌 단어 기록도 함께 비운다
  state.wrong[state.currentTeam] = [];    // 틀린 단어 기록도 함께 비운다
  makeOrder(state.currentTeam);           // 순서도 새로 섞는다
  resetTimer();
  saveState();
  renderGame();
  showToast(state.shuffle ? '순서를 새로 섞었습니다' : '처음 문제부터 다시 시작');
}

function goHome() {
  stopTimer();
  state.currentTeam = null;
  saveState();
  showScreen('home');
  renderHome();
}

/* ============================================================
   [결과 화면] 땡 처리한 단어 모아 보기
   ============================================================ */

/** '종료' 버튼 — 타이머를 멈추고 결과 화면으로 넘어간다 */
function endRound() {
  stopTimer();
  saveState();
  showScreen('review');
  renderReview();
}

/** 결과 화면에서 하던 문제로 되돌아간다 */
function backToGame() {
  showScreen('game');
  renderGame();
}

/** 한쪽 목록을 채운다 (맞힌 단어 / 틀린 단어 공통) */
function fillReviewList(container, words, kind, emptyText) {
  container.innerHTML = '';

  // 비어 있으면 목록 대신 안내 문구를 보여 준다
  if (words.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'review-empty';
    empty.textContent = emptyText;
    container.appendChild(empty);
    return;
  }

  // 처리한 순서대로 번호를 붙여 나열한다
  words.forEach((word, i) => {
    const item = document.createElement('div');
    item.className = 'review-item ' + kind;
    item.innerHTML = '<span class="n">' + (i + 1) + '</span>' +
                     '<span class="w">' + word + '</span>';
    container.appendChild(item);
  });
}

/** 결과 화면 내용을 채운다 */
function renderReview() {
  const team = state.currentTeam;
  if (!team) { goHome(); return; }

  const done    = Math.min(state.progress[team], WORDS[team].length);
  const correct = state.correct[team];
  const wrong   = state.wrong[team];

  els.rTeam.textContent  = team + '팀';
  els.rScore.textContent = state.scores[team];
  els.rDone.textContent  = done;
  // 넘김 = 푼 문제 중 정답도 땡도 아닌 것 (다음 문제로 그냥 넘긴 경우)
  els.rSkip.textContent  = Math.max(0, done - correct.length - wrong.length);

  els.rCountOk.textContent = correct.length;
  els.rCountNg.textContent = wrong.length;

  // 아직 시작 전이면 안내를 한 번만 보여 주고 오른쪽은 비워 둔다
  const notStarted = done === 0;
  fillReviewList(els.reviewOk, correct, 'ok',
                 notStarted ? '아직 진행한\n문제가 없습니다' : '맞힌 단어가\n없습니다');
  fillReviewList(els.reviewNg, wrong, 'ng',
                 notStarted ? '' : '틀린 단어가\n없습니다');
}

/* ============================================================
   [렌더링]
   ============================================================ */
const els = {};

function cacheElements() {
  const ids = [
    'screenHome', 'screenGame', 'screenReview', 'teamGrid', 'scoreHome',
    'btnNewGame', 'btnSoundHome', 'btnShuffle',
    'gTeam', 'gNo', 'gTotal', 'gBar', 'gPct', 'gLeft', 'gScore',
    'tNum', 'btnTimerToggle', 'btnTimerReset', 'timeChips',
    'wordCard', 'wordText', 'wordHint', 'btnReplayTeam',
    'btnCorrect', 'btnWrong', 'btnNext', 'btnEnd', 'btnHome', 'toast',
    'rTeam', 'rScore', 'rDone', 'rSkip',
    'reviewOk', 'reviewNg', 'rCountOk', 'rCountNg',
    'btnBackToGame', 'btnReviewHome',
    'modalBack', 'modalCancel', 'modalConfirm'
  ];
  ids.forEach(id => { els[id] = document.getElementById(id); });
}

function showScreen(name) {
  els.screenHome.classList.toggle('active', name === 'home');
  els.screenGame.classList.toggle('active', name === 'game');
  els.screenReview.classList.toggle('active', name === 'review');
  // 결과 화면에서만 앱 높이를 고정한다(목록 내부 스크롤용)
  document.querySelector('.app').classList.toggle('locked', name === 'review');
  window.scrollTo(0, 0);
}

/** 홈: 팀 선택 버튼 4개 */
function renderHome() {
  els.teamGrid.innerHTML = '';

  TEAMS.forEach(team => {
    const total = WORDS[team].length;
    const done  = Math.min(state.progress[team], total);
    const pct   = total ? Math.round((done / total) * 100) : 0;
    const over  = done >= total;

    const btn = document.createElement('button');
    btn.className = 'team-btn' + (over ? ' done' : '');
    btn.innerHTML =
      '<div class="name">' + team + '팀</div>' +
      '<div class="meta">' + (over ? '전체 완료 · ' : done + ' / ' + total + ' · ') +
      state.scores[team] + '점</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    btn.addEventListener('click', () => startTeam(team));
    els.teamGrid.appendChild(btn);
  });

  renderScoreBoard(els.scoreHome);
  renderSoundButton();
}

/** 게임 화면 전체 갱신 */
function renderGame() {
  const team  = state.currentTeam;
  if (!team) return;

  const words = currentWords();
  const total = words.length;
  const idx   = state.progress[team];
  const done  = Math.min(idx, total);
  const pct   = total ? Math.round((done / total) * 100) : 0;

  // 상단 정보
  els.gTeam.textContent  = team + '팀';
  els.gTotal.textContent = total;
  els.gNo.textContent    = Math.min(idx + 1, total);
  els.gBar.style.width   = pct + '%';
  els.gPct.textContent   = pct + '%';
  els.gLeft.textContent  = Math.max(0, total - done);
  els.gScore.textContent = state.scores[team];

  // 단어 영역
  const finished = idx >= total;
  els.wordCard.classList.toggle('finished', finished);

  if (finished) {
    els.wordText.textContent = '모든 문제가 종료되었습니다.';
    els.wordHint.textContent = team + '팀 최종 점수 ' + state.scores[team] + '점';
    els.gNo.textContent = total;
  } else {
    els.wordText.textContent = words[idx];
    els.wordHint.textContent = '';   // 진행 중에는 안내 문구를 띄우지 않는다
  }

  // 종료 시 진행 버튼 비활성화
  els.btnCorrect.disabled = finished;
  els.btnWrong.disabled   = finished;
  els.btnNext.disabled    = finished;

  renderTimer();
}

/** 점수판(홈 화면 전용) */
function renderScoreBoard(container) {
  container.innerHTML = '';
  TEAMS.forEach(team => {
    const item = document.createElement('div');
    item.className = 'score-item';
    item.innerHTML =
      '<div class="t">' + team + '팀</div>' +
      '<div class="s">' + state.scores[team] + '</div>';
    container.appendChild(item);
  });
}

/**
 * 점수 올라갈 때 살짝 튀는 피드백.
 * 게임 화면에는 점수판이 없으므로 상단 '팀 점수' 숫자를 튀게 한다.
 */
function bumpScore() {
  const el = els.gScore;
  el.classList.remove('bump');
  void el.offsetWidth;            // 리플로우 강제 → 애니메이션 재시작
  el.classList.add('bump');
}

function renderSoundButton() {
  els.btnSoundHome.textContent = state.soundOn ? '🔊 소리 켜짐' : '🔈 소리 꺼짐';
  els.btnShuffle.textContent = state.shuffle ? '🔀 무작위' : '📋 엑셀 순서';
  els.btnShuffle.classList.toggle('on', state.shuffle);
}

/* ============================================================
   [확인 창] 새 게임 시작 전 되돌릴 수 없는 동작을 한 번 확인받는다
   ============================================================ */
function openResetModal()  { els.modalBack.classList.add('show'); }
function closeResetModal() { els.modalBack.classList.remove('show'); }

/* ============================================================
   [토스트 알림]
   ============================================================ */
let toastTimer = null;
function showToast(message) {
  els.toast.textContent = message;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1400);
}

/* ============================================================
   [이벤트 연결]
   ============================================================ */
function bindEvents() {
  // 진행 버튼
  els.btnCorrect.addEventListener('click', markCorrect);
  els.btnWrong.addEventListener('click', markWrong);
  els.btnNext.addEventListener('click', nextWord);
  els.btnEnd.addEventListener('click', endRound);
  els.btnHome.addEventListener('click', goHome);
  els.btnBackToGame.addEventListener('click', backToGame);
  els.btnReviewHome.addEventListener('click', goHome);
  els.btnReplayTeam.addEventListener('click', replayTeam);

  // 타이머
  els.btnTimerToggle.addEventListener('click', toggleTimer);
  els.btnTimerReset.addEventListener('click', resetTimer);
  els.timeChips.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) setTimerTotal(Number(chip.dataset.sec));
  });

  // 소리 토글
  els.btnSoundHome.addEventListener('click', () => {
    state.soundOn = !state.soundOn;
    renderSoundButton();
    saveState();
    // 켰을 때만 짧게 한 번 울려서 소리가 나오는지 확인시켜 준다
    if (state.soundOn && ensureAudio()) {
      strikeBar(1046.50, audioCtx.currentTime, 0.40, 0.40);
    }
  });

  // 무작위 출제 토글 — 아직 시작 전인 팀은 순서를 바로 다시 만든다
  els.btnShuffle.addEventListener('click', () => {
    state.shuffle = !state.shuffle;
    TEAMS.forEach(team => {
      if (state.progress[team] === 0) makeOrder(team);
    });
    renderSoundButton();
    saveState();
    showToast(state.shuffle ? '무작위 순서로 출제합니다' : '엑셀 순서로 출제합니다');
  });

  // 새 게임 시작 — 브라우저 confirm 대신 화면 안 확인 창을 쓴다
  els.btnNewGame.addEventListener('click', openResetModal);
  els.modalCancel.addEventListener('click', closeResetModal);
  els.modalConfirm.addEventListener('click', () => {
    closeResetModal();
    resetAll();
  });
  // 바깥 어두운 영역을 눌러도 닫힌다
  els.modalBack.addEventListener('click', e => {
    if (e.target === els.modalBack) closeResetModal();
  });

  // 첫 터치에 오디오 잠금 해제
  document.addEventListener('pointerdown', ensureAudio, { once: true });

  // 키보드 단축키 (노트북으로 진행할 때 유용)
  document.addEventListener('keydown', e => {
    if (!els.screenGame.classList.contains('active')) return;
    if (e.repeat) return;
    if (e.code === 'Space')       { e.preventDefault(); markCorrect(); }
    else if (e.key === 'x' || e.key === 'X') markWrong();
    else if (e.key === 'ArrowRight') nextWord();
    else if (e.key === 'Enter')   { e.preventDefault(); toggleTimer(); }
  });

  // 앱이 백그라운드로 갔다 돌아와도 남은 시간이 정확하도록 보정
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) saveState();
    else if (timerInterval) renderTimer();
  });

  window.addEventListener('beforeunload', saveState);
}

/* ============================================================
   [화면 꺼짐 방지] 진행 중 휴대폰이 잠기지 않도록 (지원 기기 한정)
   ============================================================ */
async function keepScreenAwake() {
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* 지원하지 않으면 조용히 무시 */ }
}

/* ============================================================
   [시작]
   ============================================================ */
function init() {
  cacheElements();
  loadState();
  bindEvents();

  // 새로고침해도 진행 중이던 팀 화면으로 복귀 (타이머는 일시정지 상태)
  if (state.currentTeam && WORDS[state.currentTeam]) {
    showScreen('game');
    renderGame();
  } else {
    state.currentTeam = null;
    showScreen('home');
    renderHome();
  }

  document.addEventListener('pointerdown', keepScreenAwake, { once: true });
}

init();
</script>
